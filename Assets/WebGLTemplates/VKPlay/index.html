<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Deep Lone — Кора-7</title>
  <style>
    html,body{margin:0;padding:0;background:#0b1220;overflow:hidden;width:100%;height:100%;}
    #unity-container{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    #unity-canvas{width:960px;height:600px;max-width:100vw;max-height:100vh;background:#0b1220;}
    #loading{color:#8ab4ff;font-family:monospace;margin-top:12px;}
    #bar{width:260px;height:6px;background:#1e2a4a;border-radius:999px;overflow:hidden;margin-top:8px;}
    #bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#4a8aff,#8a4aff);transition:width .2s;}
  </style>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script>vkBridge.send('VKWebAppInit').then(()=>console.log('[VK] inited'));</script>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Загрузка шахты...</div>
    <div id="bar"><div id="bar-fill"></div></div>
  </div>
  <script>
    const canvas=document.getElementById('unity-canvas'), fill=document.getElementById('bar-fill'), loading=document.getElementById('loading');
    const buildUrl="Build", loaderUrl=buildUrl+"/{{{ LOADER_FILENAME }}}";
    const config={ dataUrl:buildUrl+"/{{{ DATA_FILENAME }}}", frameworkUrl:buildUrl+"/{{{ FRAMEWORK_FILENAME }}}", codeUrl:buildUrl+"/{{{ CODE_FILENAME }}}", streamingAssetsUrl:"StreamingAssets", companyName:"{{{ COMPANY_NAME }}}", productName:"{{{ PRODUCT_NAME }}}", productVersion:"{{{ PRODUCT_VERSION }}}", devicePixelRatio:Math.min(window.devicePixelRatio,1.5) };
    const s=document.createElement('script'); s.src=loaderUrl;
    s.onload=()=>createUnityInstance(canvas, config, p=>{fill.style.width=(p*100)+'%'; loading.textContent='Бурение '+Math.floor(p*100)+'%';}).then(inst=>{
      window.unityInstance=inst; loading.style.display='none'; document.getElementById('bar').style.display='none';
      vkBridge.send('VKWebAppShowOrderBox', {type:'item'}).catch(()=>{});
    });
    document.body.appendChild(s);
    document.addEventListener('visibilitychange', ()=>{ if(!window.unityInstance) return; window.unityInstance.SendMessage('Boot','OnApplicationFocus', document.hidden?0:1); });
  </script>
</body>
</html>
